<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muni-Ascope</title>
  <link rel="stylesheet" href="../user/css/crear.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header>

  <div class="logo">

    <img src="../../../multimedia/admin1.png" alt="Municipalidad">

  </div>

</header>

<main>

  <section class="panel">

    <h1>

      PANEL DE

      <span>GESTION</span>

    </h1>

    <div class="grid-panel">

      <button
        class="card-opcion"
        data-url="crear_noticia.html">

        <i class="bi bi-newspaper"></i>

        <span>Crear Noticias</span>

      </button>

      <button
        class="card-opcion"
        data-url="crear_documento.html">

        <i class="bi bi-file-earmark-text-fill"></i>

        <span>Crear Documento</span>

      </button>

      <button
        class="card-opcion"
        data-url="crear_agenda.html">

        <i class="bi bi-calendar-event-fill"></i>

        <span>Crear Agenda</span>

      </button>

      <button
        class="card-opcion"
        data-url="crear_visitas.html">

        <i class="bi bi-people-fill"></i>

        <span>Crear Visita</span>

      </button>

    </div>

  </section>

</main>

<footer>

  <img src="../../../multimedia/admin2.png" alt="Gob">

</footer>

<script type="module" src="../user/js/crear.js"></script>

</body>
</html>
