<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear Agenda</title>

  <link rel="stylesheet" href="../user/css/c_agenda.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">

</head>

<body>

<div class="contenedor">

  <!-- ================= CABECERA ================= -->

  <header class="cabecera">

    <img src="../../../multimedia/admin1.png" alt="Municipalidad Provincial de Ascope">

  </header>

  <!-- ================= CONTENIDO ================= -->

  <main class="contenido">

    <h1>CREAR</h1>

    <h2>AGENDA</h2>

    <form id="frmAgenda">

      <!-- ACTIVIDAD -->

      <div class="grupo">

        <label for="actividad">
          Actividad <span class="obligatorio">*</span>
        </label>

        <div class="campo">

          <input
            type="text"
            id="actividad"
            maxlength="50"
            placeholder="Ingrese la actividad"
            required>

          <div class="contador">
            <span id="contadorActual">0</span>/<span>50</span>
          </div>

        </div>

      </div>


      <!-- LUGAR -->

      <div class="grupo">

        <label for="lugar">

          Lugar

        </label>

        <div class="campo">

          <select
            id="lugar"
            name="lugar"
            required>

            <option value="">
              Seleccione un lugar
            </option>

            <option>Auditorio Municipal</option>

            <option>Auditorio de Defensa Civil</option>

            <option>Centro Poblado Roma</option>

            <option>Centro de Salud Ascope</option>

            <option>Distrito de Chicama</option>

            <option>Plaza Mayor de Ascope</option>

            <option>Plaza de Armas de Ascope</option>

            <option>Salón Consistorial</option>

            <option>Sector La Arenita</option>

          </select>

        </div>

      </div>


      <!-- FECHA -->

      <div class="grupo">

        <label for="fecha">

          Fecha

        </label>

        <div class="campo">

          <input
            type="date"
            id="fecha"
            name="fecha"
            required>

        </div>

      </div>


      <!-- HORA -->

      <div class="grupo">

        <label for="hora">

          Hora

        </label>

        <div class="campo">

          <input
            type="time"
            id="hora"
            name="hora"
            required>

        </div>

      </div>


      <!-- BOTONES -->

      <div class="botones">

        <a class="btn-cancelar"
           id="btnCancelar">

          <i class="bi bi-arrow-left-circle"></i>

          Cancelar

        </a>

        <button
          type="submit"
          class="btn-guardar">

          <i class="bi bi-floppy"></i>

          Guardar Agenda

        </button>

      </div>

    </form>

  </main>

  <!-- ================= PIE ================= -->

  <footer class="pie">

    <img src="../../../multimedia/admin2.png" alt="Gob.pe">

  </footer>

</div>

<script src="../user/js/c_agenda.js"></script>
<script type="module" src="../user/js/crear.js"></script>

</body>

</html>
