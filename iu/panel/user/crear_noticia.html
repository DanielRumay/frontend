<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muni-Ascope</title>
  <link rel="stylesheet" href="../user/css/c_noticia.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header class="header">

  <img
    src="../../../multimedia/admin1.png"
    alt="Municipalidad Provincial de Ascope">

</header>

<main class="main">

  <section class="contenedor-formulario">

    <h1>

      CREAR

      <span>NOTICIA</span>

    </h1>

    <form
      id="formNoticia"
      autocomplete="off">

      <!-- ========================== -->

      <div class="grupo">

        <label for="titulo">

          Título

          <span>*</span>

        </label>

        <div class="campo">

          <input
            type="text"
            id="titulo"
            maxlength="50"
            placeholder="Ingrese el título">

          <small id="contadorTitulo">

            0 / 50

          </small>

        </div>

      </div>

      <!-- ========================== -->

      <div class="grupo">

        <label for="resumen">

          Resumen

          <span>*</span>

        </label>

        <div class="campo">

                    <textarea
                      id="resumen"
                      rows="2"
                      maxlength="100"
                      placeholder="Ingrese un resumen"></textarea>

          <small id="contadorResumen">

            0 / 100

          </small>

        </div>

      </div>

      <!-- ========================== -->

      <div class="grupo">

        <label for="contenido">

          Contenido

          <span>*</span>

        </label>

        <div class="campo">

                    <textarea
                      id="contenido"
                      rows="8"
                      placeholder="Ingrese el contenido de la noticia"></textarea>

        </div>

      </div>

      <!-- ========================== -->

      <div class="grupo">

        <label>

          Imagen

          <span>*</span>

        </label>

        <div class="campo">

          <div class="tipo-imagen">

            <label class="radio-opcion">

              <input
                type="radio"
                name="tipoImagen"
                value="archivo"
                checked>

              Subir imagen

            </label>

            <label class="radio-opcion">

              <input
                type="radio"
                name="tipoImagen"
                value="url">

              Usar URL

            </label>

          </div>

          <!-- SUBIR ARCHIVO -->

          <div id="contenedorArchivo">

            <label
              for="imagen"
              class="btn-imagen">

              <i class="bi bi-image-fill"></i>

              Seleccionar imagen

            </label>

            <input
              type="file"
              id="imagen"
              accept="image/*"
              hidden>

            <small id="nombreImagen">

              Ningún archivo seleccionado

            </small>

          </div>

          <!-- URL -->

          <div id="contenedorURL">

            <div class="input-url">

              <i class="bi bi-link-45deg"></i>

              <input
                type="url"
                id="urlImagen"
                placeholder="https://ejemplo.com/imagen.jpg">

            </div>

          </div>

          <div class="preview">

            <img
              id="previewImagen"
              src=""
              alt="Vista previa">

          </div>

        </div>

      </div>

      <!-- ========================== -->

      <div class="grupo">

        <label for="categoria">

          Categoría

          <span>*</span>

        </label>

        <div class="campo">

          <select id="categoria">

            <option value="">

              Seleccione...

            </option>

            <option>

              Desarrollo Social

            </option>

            <option>

              Educación

            </option>

            <option>

              Institucional

            </option>

            <option>

              Medio Ambiente

            </option>

            <option>

              Obras

            </option>

            <option>

              Salud

            </option>

            <option>

              Turismo

            </option>

          </select>

        </div>

      </div>

      <!-- ========================== -->

      <div class="grupo">

        <label for="fechaPublicacion">

          Fecha

          <span>*</span>

        </label>

        <div class="campo">

          <input
            type="date"
            id="fechaPublicacion">

        </div>

      </div>

      <!-- ========================== -->

      <div class="botones">

        <button
          type="button"
          id="btnCancelar"
          class="btn-cancelar">

          <i class="bi bi-arrow-left-circle"></i>

          Cancelar

        </button>

        <button
          type="submit"
          class="btn-guardar">

          <i class="bi bi-floppy-fill"></i>

          Guardar Noticia

        </button>

      </div>

    </form>

  </section>

</main>

<footer class="footer">

  <img
    src="../../../multimedia/admin2.png"
    alt="Gob.pe">

</footer>

<script type="module" src="../user/js/c_noticia.js"></script>
<script type="module" src="../user/js/crear.js"></script>

</body>
</html>
