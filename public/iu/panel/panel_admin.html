<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muni-Ascope</title>
  <link rel="stylesheet" href="css/admin.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header>

  <div class="logo">

    <img src="../../multimedia/admin1.png" alt="Municipalidad">

  </div>

</header>

<main>

  <div class="login-box">

    <h1>

      PANEL DE

      <span>GESTION</span>

    </h1>

    <form id="formLogin">

      <div class="input-group">

        <label>Username</label>

        <input
          type="text"
          id="usuario"
          required>

      </div>

      <div class="input-group">

        <label>Password</label>

        <div class="password">

          <input
            type="password"
            id="password"
            required>

          <button
            type="button"
            id="mostrarPassword">

            <i class="bi bi-eye"></i>

          </button>

        </div>

      </div>

      <button
        type="submit"
        class="btn-login">

        Ingresar

      </button>

    </form>

  </div>

</main>

<footer>

  <img src="../../multimedia/admin2.png" alt="Gob">

</footer>

<script type="module" src="js/admin.js"></script>

</body>
</html>
