<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muni-Ascope</title>
  <link rel="stylesheet" href="css/c_doc.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header class="header">

  <img
    src="../../../multimedia/admin1.png"
    alt="Municipalidad Provincial de Ascope">

</header>

<main class="main">

  <section class="contenedor-formulario">

    <h1>

      CREAR

      <span>DOCUMENTO</span>

    </h1>

    <form
      id="formDocumento"
      autocomplete="off">

      <!--========================-->

      <div class="grupo">

        <label for="nombre">

          Nombre

          <span>*</span>

        </label>

        <div class="campo">

          <input
            type="text"
            id="nombre"
            maxlength="100"
            placeholder="Ingrese el nombre del documento">

          <small id="contadorNombre">

            0 / 100

          </small>

        </div>

      </div>

      <!--========================-->

      <div class="grupo">

        <label>

          Documento

          <span>*</span>

        </label>

        <div class="campo">

          <label
            for="archivo"
            class="btn-imagen">

            <i class="bi bi-file-earmark-arrow-up-fill"></i>

            Seleccionar documento

          </label>

          <input
            type="file"
            id="archivo"
            accept=".pdf,.doc,.docx"
            hidden>

          <small id="nombreArchivo">

            Ningún documento seleccionado

          </small>

          <div class="preview-documento">

            <i class="bi bi-file-earmark-pdf-fill"></i>

            <h3 id="archivoSeleccionado">

              --

            </h3>

            <span id="archivoInfo">

                            PDF • 0 MB

                        </span>

          </div>

        </div>

      </div>

      <!--========================-->

      <div class="grupo">

        <label for="categoria">

          Categoría

          <span>*</span>

        </label>

        <div class="campo">

          <select id="categoria">

            <option value="">Seleccione...</option>

            <option>Ordenanzas</option>
            <option>Decretos de Alcaldía</option>
            <option>Resoluciones</option>
            <option>Acuerdos de Concejo</option>
            <option>Directivas</option>
            <option>Convocatorias</option>
            <option>Informes</option>
            <option>Presupuesto</option>
            <option>Planeamiento</option>
            <option>Otros</option>

          </select>

        </div>

      </div>

      <!--========================-->

      <div class="grupo">

        <label for="fecha">

          Fecha

          <span>*</span>

        </label>

        <div class="campo">

          <input
            type="date"
            id="fecha">

        </div>

      </div>

      <!--========================-->

      <div class="botones">

        <button
          type="button"
          id="btnCancelar"
          class="btn-cancelar">

          <i class="bi bi-arrow-left-circle"></i>

          Cancelar

        </button>

        <button
          type="submit"
          class="btn-guardar">

          <i class="bi bi-floppy-fill"></i>

          Guardar Documento

        </button>

      </div>

    </form>

  </section>

</main>

<footer class="footer">

  <img
    src="../../../multimedia/admin2.png"
    alt="Gob.pe">

</footer>



<script type="module" src="js/c_doc.js"></script>
<script type="module" src="js/crear.js"></script>

</body>
</html>
