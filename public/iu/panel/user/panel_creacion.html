<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muni-Ascope - Panel de Gestión</title>
  <link rel="stylesheet" href="css/crear.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header>

  <div class="logo">
    <img src="../../../multimedia/admin1.png" alt="Municipalidad">
  </div>

  <!-- PERFIL -->
  <div class="profile-container">
    <button
      class="profile-button"
      id="btnPerfil"
      type="button"
      aria-label="Opciones de perfil">
      <img
        id="fotoPerfil"
        src="../../../multimedia/admin1.png"
        alt="Foto de perfil">
    </button>

    <!-- MENÚ DEL PERFIL -->
    <div
      class="profile-menu"
      id="menuPerfil">
      <button
        type="button"
        class="profile-menu-item logout-item"
        id="btnCerrarSesion">
        <i class="bi bi-box-arrow-right"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>

</header>

<main>

  <section class="panel">

    <h1>
      PANEL DE
      <span>GESTION</span>
    </h1>

    <div class="grid-panel">

      <button
        class="card-opcion"
        data-url="crear_noticia.html">
        <i class="bi bi-newspaper"></i>
        <span>Crear Noticias</span>
      </button>

      <button
        class="card-opcion"
        data-url="crear_documento.html">
        <i class="bi bi-file-earmark-text-fill"></i>
        <span>Crear Documento</span>
      </button>

      <button
        class="card-opcion"
        data-url="crear_agenda.html">
        <i class="bi bi-calendar-event-fill"></i>
        <span>Crear Agenda</span>
      </button>

      <button
        class="card-opcion"
        data-url="crear_visitas.html">
        <i class="bi bi-people-fill"></i>
        <span>Crear Visita</span>
      </button>

    </div>

  </section>

</main>

<footer>

  <img src="../../../multimedia/admin2.png" alt="Gob">

</footer>

<!-- MODAL CERRAR SESIÓN -->
<div class="modal-overlay" id="modalLogout" style="display: none;">
  <div class="logout-modal">
    <div class="logout-modal-icon">
      <i class="bi bi-box-arrow-right"></i>
    </div>
    <h2>¿Cerrar sesión?</h2>
    <p>¿Estás seguro de que deseas cerrar tu sesión?</p>
    <div class="modal-actions">
      <button type="button" class="btn-modal-cancel" id="btnCancelarLogout">Cancelar</button>
      <button type="button" class="btn-modal-confirm" id="btnConfirmarLogout">Cerrar sesión</button>
    </div>
  </div>
</div>

<script type="module" src="js/crear.js"></script>

</body>
</html>
